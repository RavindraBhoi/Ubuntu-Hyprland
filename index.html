<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Networking Fundamentals - Study Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon"></span>
          NetAcademy
        </div>
        <div class="progress-widget">
          <div class="progress-header">
            <span>Overall Progress</span>
            <span id="overall-progress-text">0%</span>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar" id="overall-progress-bar"></div>
          </div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Sidebar items will be dynamically generated by JS -->
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-title" id="current-week-title">Week 1: Introduction & Network Devices</div>
        <div class="timer-widget">
          <div class="timer-icon"></div>
          <span class="timer-text" id="timer-display">60:00</span>
          <div class="timer-controls">
            <button id="timer-toggle-btn">Start</button>
            <button id="timer-reset-btn">Reset</button>
          </div>
        </div>
      </header>

      <!-- Content Grid -->
      <div class="content-body">
        <!-- Left Column: Video & Exercises -->
        <div class="content-left">
          <!-- Video Card -->
          <div class="card">
            <div class="card-title">Study Videos</div>
            <div class="video-tabs" id="video-tabs">
              <!-- Video tab buttons dynamically generated -->
            </div>
            <div class="video-player-container">
              <iframe id="video-iframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
          </div>

          <!-- Hands-on Tasks Card -->
          <div class="card">
            <div class="card-title">Hands-on Lab Exercises</div>
            <div class="hands-on-container" id="hands-on-container">
              <!-- Lab tasks will be dynamically inserted here -->
            </div>
          </div>
        </div>

        <!-- Right Column: Notes & Quiz -->
        <div class="content-right">
          <!-- Quiz Card -->
          <div class="card">
            <div class="card-title">Knowledge Check</div>
            <div id="quiz-container">
              <div class="quiz-question" id="quiz-question">Question text goes here?</div>
              <div class="quiz-options" id="quiz-options">
                <!-- Options dynamically generated -->
              </div>
              <div class="quiz-feedback" id="quiz-feedback">Feedback goes here.</div>
              <div class="quiz-navigation">
                <span class="quiz-progress-text" id="quiz-progress-text">Question 1 of 5</span>
                <button class="quiz-btn" id="quiz-next-btn" disabled>Next Question</button>
              </div>
            </div>
          </div>

          <!-- Notes Card -->
          <div class="card">
            <div class="card-title">My Study Notes</div>
            <div class="notes-container">
              <div class="notes-header">
                <span class="notes-save-status" id="save-status">Saved locally</span>
                <button class="btn-secondary" id="download-notes-btn">Download Notes (.txt)</button>
              </div>
              <textarea class="notes-textarea" id="notes-input" placeholder="Type your notes here... They are automatically saved."></textarea>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
