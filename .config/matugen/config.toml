[config]
reload_apps = true

[config.colors]
mode = "dark"

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors.css"

[templates.wofi]
input_path = "~/.config/matugen/templates/wofi-colors.css"
output_path = "~/.config/wofi/colors.css"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors.conf"

[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/colors.lua"

[templates.wob]
input_path = "~/.config/matugen/templates/wob-colors.ini"
output_path = "~/.config/wob/wob.ini"

[templates.kdeglobals]
input_path = "~/.config/matugen/templates/kdeglobals.ini"
output_path = "~/.config/kdeglobals"

[templates.hyprlock]
input_path = "~/.config/matugen/templates/colors.conf"
output_path = "~/.config/hypr/colors.conf"

[templates.fuzzel]
input_path = "~/.config/matugen/templates/fuzzel.ini"
output_path = "~/.config/fuzzel/fuzzel.ini"

[templates.helium]
input_path = "~/.config/matugen/templates/helium-manifest.json"
output_path = "~/.config/helium/dynamic-theme/manifest.json"

[templates.ashell]
input_path = "~/.config/matugen/templates/ashell-config.toml"
output_path = "~/.config/ashell/config.toml"

