[main]
font=JetBrains Mono:weight=bold:size=14
prompt="   Search: "
icon-theme=Papirus-Dark
icons-enabled=yes
show-actions=yes
terminal=kitty

# Unixporn standard elegant proportions (tall & moderately wide)
lines=12
width=35
horizontal-pad=30
vertical-pad=30
inner-pad=20
line-height=30
layer=overlay

[colors]
# Soft frosted background
background={{colors.surface.default.hex_stripped}}e6
text={{colors.on_surface.default.hex_stripped}}ff
match={{colors.primary.default.hex_stripped}}ff
selection={{colors.surface_variant.default.hex_stripped}}ff
selection-text={{colors.on_surface_variant.default.hex_stripped}}ff
selection-match={{colors.primary.default.hex_stripped}}ff
border={{colors.primary.default.hex_stripped}}ff

[border]
width=2
radius=16
