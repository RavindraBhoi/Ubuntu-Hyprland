general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on; brightnessctl set 50%  # to avoid having to interact with the pc twice to turn on the display.
}

# Dim screen after 2.5 mins of inactivity
listener {
    timeout = 150                                
    on-timeout = brightnessctl -s set 10         
    on-resume = brightnessctl -r                 
}

# Turn off keyboard backlight after 10s of inactivity (resumes on keypress/touchpad/mouse)
listener { 
    timeout = 10                                          
    on-timeout = brightnessctl -sd '*kbd_backlight*' set 0 || brightnessctl -sd 'rgb:kbd_backlight' set 0 || true
    on-resume = brightnessctl -rd '*kbd_backlight*' || brightnessctl -rd 'rgb:kbd_backlight' || true
}

# Lock screen after 5 mins of inactivity
listener {
    timeout = 300                                 
    on-timeout = loginctl lock-session            
}

# Turn off screen after 5.5 mins of inactivity (30s after locking)
listener {
    timeout = 330                                 
    on-timeout = hyprctl dispatch dpms off        
    on-resume = hyprctl dispatch dpms on          
}

