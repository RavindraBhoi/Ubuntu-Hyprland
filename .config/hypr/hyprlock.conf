source = ~/.config/hypr/colors.conf

# BACKGROUND
background {
    monitor =
    path = /home/ravindra/.cache/current_wallpaper.jpg
    blur_passes = 2
    blur_size = 7
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 280, 60
    outline_thickness = 2
    dots_size = 0.2 
    dots_spacing = 0.35 
    dots_center = true
    outer_color = $primary
    inner_color = $surface
    font_color = $on_surface
    fade_on_empty = false
    rounding = 22
    check_color = $primary
    placeholder_text = <i><span foreground="lightgray">Enter Password...</span></i>
    hide_input = false
    position = 0, -180
    halign = center
    valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = $on_surface
  font_size = 26
  font_family = JetBrains Mono
  position = 0, 220
  halign = center
  valign = center
}

# TIME
label {
  monitor = 
  text = cmd[update:1000] echo "$(date +"%-I:%M")"
  color = $primary
  font_size = 110
  font_family = JetBrains Mono Extrabold
  position = 0, 100
  halign = center
  valign = center
}

# USER
label {
    monitor =
    text = Welcome back, Ravindra!
    color = $on_surface
    font_size = 22
    font_family = JetBrains Mono Bold
    position = 0, -20
    halign = center
    valign = center
}

# BATTERY
label {
    monitor =
    text = cmd[update:5000] echo "$(/home/ravindra/.config/hypr/scripts/battery.sh)"
    color = $on_surface
    font_size = 18
    font_family = JetBrains Mono Bold
    position = -30, 30
    halign = right
    valign = bottom
}

# NOW PLAYING
label {
    monitor =
    text = cmd[update:2000] echo "$(/home/ravindra/.config/hypr/scripts/now_playing.sh)"
    color = $on_surface
    font_size = 14
    font_family = JetBrains Mono
    position = 0, -80
    halign = center
    valign = center
}
